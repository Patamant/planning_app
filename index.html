<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestión de Objetivos - Ingreso</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="login-caja">
  <h2>Gestión de Objetivos</h2>
  <form id="formLogin">
    <label>Usuario</label>
    <input type="text" id="usuario" required autocomplete="username">
    <label>Contraseña</label>
    <input type="password" id="password" required autocomplete="current-password">
    <div class="error" id="error"></div>
    <button type="submit" style="width:100%">Ingresar</button>
  </form>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById('formLogin').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  const usuario = document.getElementById('usuario').value.trim();
  const password = document.getElementById('password').value;
  const errorDiv = document.getElementById('error');
  errorDiv.textContent = '';

  try {
    const res = await apiCall('login', { usuario, password });
    if (!res.ok) {
      errorDiv.textContent = res.error || 'No se pudo iniciar sesión.';
      return;
    }
    guardarSesion(res);
    redirigirSegunPerfil(res.perfil);
  } catch (e) {
    errorDiv.textContent = 'Error de conexión con el servidor.';
  }
});
</script>
</body>
</html>
