    <span id="nombreUsuario"></span> &nbsp;

<main>

  <p style="font-size:12px;color:#666;margin-top:-8px">

  <!-- ===== PENDIENTES ===== -->

    <h3>Avances mensuales pendientes de tu aprobación</h3>

      <thead><tr><th>Código Proyecto</th><th>Mes</th><th>Enviado por</th><th>Fecha</th><th>Acción</th></tr></thead>
      <tbody id="tablaPendientes"></tbody>
    </table>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>

document.getElementById('nombreUsuario').textContent = sessionStorage.getItem('nombre') || sessionStorage.getItem('usuario');

const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];

  },

      { meses: ['E-ABRIL', 'E-MAYO', 'E-JUNIO'], total: 'TRIMESTRE 2' },
      { meses: ['E- JULIO', 'E-AGOSTO', 'E-SEPTIEMBRE'], total: 'TRIMESTRE 3' },

    ],

  },

      { meses: ['ABRIL', 'MAYO', 'JUNIO'], total: 'PAGADO TRIMESTRE 2' },
      { meses: ['JULIO', 'AGOSTO', 'SEPTIEMBRE'], total: 'PAGADO TRIMESTRE 3' },

function salir() { cerrarSesionLocal(); window.location.href = 'index.html'; }

function mostrarTab(tab) {
  document.getElementById('tabMatriz').style.display = tab === 'matriz' ? 'block' : 'none';
  document.getElementById('tabPendientes').style.display = tab === 'pendientes' ? 'block' : 'none';
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('activo'));
  event.target.classList.add('activo');
  if (tab === 'pendientes') cargarPendientes();
}

let matrizData = null;

/** Convierte el valor crudo de AVANCE FÍSICO (número 0-1, texto "70,00%", etc.) a un entero 0-100. */
function porcentajeANumero(valorCrudo) {
  if (valorCrudo === null || valorCrudo === undefined || valorCrudo === '') return 0;
  if (typeof valorCrudo === 'number') {
    return valorCrudo <= 1 ? Math.round(valorCrudo * 100) : Math.round(valorCrudo);
  }
  const limpio = String(valorCrudo).replace('%', '').replace(',', '.').trim();
  const num = parseFloat(limpio);
  if (isNaN(num)) return 0;
  return num <= 1 ? Math.round(num * 100) : Math.round(num);
}

function colorSemaforo(pct) {
  if (pct < 40) return 'rojo';
  if (pct < 75) return 'amarillo';
  return 'verde';
}

/** Genera el HTML de la barra de progreso con semáforo, a partir del valor crudo de AVANCE FÍSICO. */
function renderProgreso(valorCrudo) {
  const pct = Math.max(0, Math.min(100, porcentajeANumero(valorCrudo)));
  const color = colorSemaforo(pct);
  return `<div class="progreso-wrap">
    <div class="progreso-barra-contenedor"><div class="progreso-barra ${color}" style="width:${pct}%"></div></div>
    <span class="progreso-texto ${color}">${pct}%</span>
  </div>`;
}

async function cargarMatriz() {
  const res = await apiCall('obtenerMatriz', {});
  if (!res.ok) { alert(res.error); return; }
  matrizData = res;
  const tbody = document.getElementById('tablaProyectos');
  tbody.innerHTML = '';
  res.filas.forEach(fila => {
    const claveProyecto = buscarHeaderReal(fila.datos, 'PROYECTO');
    const claveUnidad = buscarHeaderReal(fila.datos, 'UNIDAD ADMINISTRATIVA');
    const claveAvance = buscarHeaderReal(fila.datos, 'AVANCE FÍSICO');
    const proyecto = claveProyecto ? fila.datos[claveProyecto].valor : '';
    const unidad = claveUnidad ? fila.datos[claveUnidad].valor : '';
    const avanceFisico = claveAvance ? fila.datos[claveAvance].valor : 0;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${fila.codigo_proyecto}</td><td>${proyecto}</td><td>${unidad}</td>
      <td>${renderProgreso(avanceFisico)}</td>
      <td><button data-codigo="${fila.codigo_proyecto}" class="btn-ver-detalle">Ver / Editar</button></td>`;
    tbody.appendChild(tr);
  });

  // Delegación de eventos: evita cualquier problema con caracteres especiales
  // en el código de proyecto al insertarlo dentro de un atributo onclick.
  tbody.querySelectorAll('.btn-ver-detalle').forEach(btn => {
    btn.addEventListener('click', () => verDetalle(btn.dataset.codigo));
  });
}

function fieldIdDe(header) {
  return 'campo_' + header.replace(/[^a-zA-Z0-9]/g, '_');
}

/** Colapsa espacios/saltos de línea y normaliza mayúsculas, para comparar encabezados
 *  sin que fallen por espacios invisibles provenientes del Google Sheet original. */
function normalizarHeader(h) {
  return String(h || '').replace(/\s+/g, ' ').trim().toUpperCase();
}

/** Busca en "datos" la clave real (tal como llegó del backend) que corresponde
 *  al encabezado que buscamos, ignorando diferencias de espacios en blanco. */
function buscarHeaderReal(datos, headerBuscado) {
  const objetivo = normalizarHeader(headerBuscado);
  return Object.keys(datos).find(k => normalizarHeader(k) === objetivo) || null;
}

/** Renderiza un campo individual (label + input o valor bloqueado + botón Guardar si aplica) */
function renderCampo(codigo, headerBuscado, datos) {
  const headerReal = buscarHeaderReal(datos, headerBuscado);
  if (!headerReal) {
    return `<div class="campo-item"><label>${headerBuscado}</label><span class="valor-vacio">— (columna no encontrada) —</span></div>`;
  }
  const campo = datos[headerReal];
  const fieldId = fieldIdDe(headerReal);
  if (campo.editable) {
    return `<div class="campo-item">
      <label>${headerBuscado}</label>
      <div class="campo-input-row">
        <input class="celda-editable" id="${fieldId}" value="${campo.valor}">
        <button onclick="guardarCampo('${codigo.replace(/'/g,"\\'")}', '${headerReal.replace(/'/g,"\\'")}', '${fieldId}', this)">Guardar</button>
      </div>
    </div>`;
  }
  return `<div class="campo-item">
    <label>${headerBuscado} <span class="badge SISTEMA">${campo.perfil_columna}</span></label>
    <input class="celda-bloqueada" value="${campo.valor}" disabled>
  </div>`;
}

/** Igual que renderCampo, pero muestra y edita el valor como porcentaje legible (0-100)
 *  en vez del valor crudo (fracción 0-1) que usa internamente el Google Sheet. */
function renderCampoPorcentaje(codigo, headerBuscado, datos) {
  const headerReal = buscarHeaderReal(datos, headerBuscado);
  if (!headerReal) {
    return `<div class="campo-item"><label>${headerBuscado}</label><span class="valor-vacio">— (columna no encontrada) —</span></div>`;
  }
  const campo = datos[headerReal];
  const fieldId = fieldIdDe(headerReal);
  const pct = porcentajeANumero(campo.valor);
  if (campo.editable) {
    return `<div class="campo-item">
      <label>${headerBuscado}</label>
      <div class="campo-input-row">
        <input class="celda-editable" type="number" min="0" max="100" step="1" style="max-width:80px" id="${fieldId}" value="${pct}">
        <span style="align-self:center;font-weight:600">%</span>
        <button onclick="guardarCampoPorcentaje('${codigo.replace(/'/g,"\\'")}', '${headerReal.replace(/'/g,"\\'")}', '${fieldId}', this)">Guardar</button>
      </div>
    </div>`;
  }
  return `<div class="campo-item">
    <label>${headerBuscado} <span class="badge SISTEMA">${campo.perfil_columna}</span></label>
    <input class="celda-bloqueada" value="${pct}%" disabled>
  </div>`;
}

/** Guarda un campo de porcentaje: el usuario ve/edita 0-100, pero se guarda como fracción 0-1. */
async function guardarCampoPorcentaje(codigo, header, fieldId, boton) {
  const inputEl = document.getElementById(fieldId);
  const pctIngresado = parseFloat(inputEl.value);
  if (isNaN(pctIngresado) || pctIngresado < 0 || pctIngresado > 100) {
    alert('Ingresa un porcentaje válido entre 0 y 100.');
    return;
  }
  const fraccion = pctIngresado / 100;
  if (boton) { var textoOriginal = boton.textContent; boton.disabled = true; boton.textContent = 'Guardando...'; }
  try {
    const res = await apiCall('guardarCelda', { codigo_proyecto: codigo, header, valor: fraccion });
    if (!res.ok) {
      alert('No se pudo guardar: ' + res.error);
      if (boton) { boton.disabled = false; boton.textContent = textoOriginal; }
      return;
    }
    const fila = matrizData.filas.find(f => String(f.codigo_proyecto) === String(codigo));
    if (fila && fila.datos[header]) fila.datos[header].valor = fraccion;
    if (res.debug) console.log('Guardado en Sheet:', res.debug);
    if (boton) {
      boton.textContent = '✓ Guardado';
      setTimeout(() => { boton.disabled = false; boton.textContent = textoOriginal; }, 1500);
    }
    cargarMatriz();
  } catch (err) {
    console.error('Error al guardar el porcentaje:', err);
    alert('Ocurrió un error de conexión al guardar. Revisa la consola (F12) para más detalle.');
    if (boton) { boton.disabled = false; boton.textContent = textoOriginal; }
  }
}

/** Renderiza un bloque de 4 trimestres (3 meses + total del sistema cada uno) en formato compacto de tabla */
function renderBloqueTrimestral(codigo, datos, trimestres, tituloExtra, esPorcentaje) {
  let html = '<table class="tabla-trimestral"><thead><tr>';
  trimestres.forEach((t, i) => { html += `<th colspan="3">Trimestre ${i + 1}</th>`; });
  html += '</tr><tr>';
  trimestres.forEach(t => { t.meses.forEach(m => { html += `<th>${m.replace(/^E-\s*/, '')}</th>`; }); });
  html += '</tr></thead><tbody><tr>';
  trimestres.forEach(t => {
    t.meses.forEach(mesHeaderBuscado => {
      const mesHeaderReal = buscarHeaderReal(datos, mesHeaderBuscado);
      if (!mesHeaderReal) { html += '<td>—</td>'; return; }
      const campo = datos[mesHeaderReal];
      const fieldId = fieldIdDe(mesHeaderReal);
      const valorMostrado = esPorcentaje ? porcentajeANumero(campo.valor) + '%' : campo.valor;
      if (campo.editable) {
        html += `<td><input class="celda-editable" style="width:70px" id="${fieldId}" value="${campo.valor}">
          <button style="padding:3px 6px;font-size:11px;margin-top:2px" onclick="guardarCampo('${codigo.replace(/'/g,"\\'")}', '${mesHeaderReal.replace(/'/g,"\\'")}', '${fieldId}', this)">💾</button></td>`;
      } else {
        html += `<td><input class="celda-bloqueada" style="width:70px" value="${valorMostrado}" disabled></td>`;
      }
    });
  });
  html += '</tr><tr>';
  trimestres.forEach(t => {
    const totalHeaderReal = buscarHeaderReal(datos, t.total);
    const campoTotal = totalHeaderReal ? datos[totalHeaderReal] : null;
    const totalMostrado = campoTotal ? (esPorcentaje ? porcentajeANumero(campoTotal.valor) + '%' : campoTotal.valor) : '—';
    html += `<td colspan="3" class="celda-total-sistema">Total trimestre: <b>${totalMostrado}</b></td>`;
  });
  html += '</tr></tbody></table>';
  if (tituloExtra && tituloExtra.length) {
    tituloExtra.forEach(header => {
      html += esPorcentaje ? renderCampoPorcentaje(codigo, header, datos) : renderCampo(codigo, header, datos);
    });
  }
  return html;
}

function verDetalle(codigo) {
  console.log('verDetalle llamado con codigo:', codigo);
  if (!matrizData) { console.warn('matrizData aún no está cargado.'); return; }
  const fila = matrizData.filas.find(f => String(f.codigo_proyecto).trim() === String(codigo).trim());
  if (!fila) {
    console.warn('No se encontró ninguna fila con codigo_proyecto =', codigo,
      '. Códigos disponibles:', matrizData.filas.map(f => f.codigo_proyecto));
    return;
  }
  const datos = fila.datos;
  const cont = document.getElementById('detalleProyecto');
  cont.style.display = 'block';

  const claveProyectoDet = buscarHeaderReal(datos, 'PROYECTO');
  const claveAvanceDet = buscarHeaderReal(datos, 'AVANCE FÍSICO');
  let html = `<div class="detalle-header">
    <h3>Proyecto ${codigo}${claveProyectoDet ? ' — ' + datos[claveProyectoDet].valor : ''}</h3>
    ${claveAvanceDet ? renderProgreso(datos[claveAvanceDet].valor) : ''}
    <button class="secundario" onclick="cerrarDetalle()">Cerrar</button>
  </div>`;

  // Menú lateral: un enlace por sección, con desplazamiento suave hacia ella al hacer clic.
  let htmlMenu = '<nav class="detalle-menu">';
  SECCIONES.forEach((seccion, idx) => {
    htmlMenu += `<a href="#seccion-${idx}" class="nav-seccion" data-idx="${idx}">${seccion.corto}</a>`;
  });
  htmlMenu += '</nav>';

  let htmlSecciones = '<div class="detalle-secciones">';
  SECCIONES.forEach((seccion, idx) => {
    htmlSecciones += `<div class="seccion" id="seccion-${idx}"><h4 class="seccion-titulo">${seccion.titulo}</h4><div class="seccion-cuerpo">`;
    if (seccion.trimestres) {
      htmlSecciones += `<div class="tabla-scroll">${renderBloqueTrimestral(codigo, datos, seccion.trimestres, seccion.extra, seccion.esPorcentaje)}</div>`;
    } else if (seccion.tipo === 'porcentaje') {
      seccion.campos.forEach(header => { htmlSecciones += renderCampoPorcentaje(codigo, header, datos); });
    } else {
      seccion.campos.forEach(header => { htmlSecciones += renderCampo(codigo, header, datos); });
    }
    htmlSecciones += '</div></div>';
  });
  htmlSecciones += '</div>';

  html += `<div class="detalle-layout">${htmlMenu}${htmlSecciones}</div>`;
  cont.innerHTML = html;
  activarMenuDetalle(cont);
  cont.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/**
 * Activa el menú lateral del detalle: clic para desplazarse suavemente a la sección,
 * y resaltado automático de la sección visible mientras el usuario hace scroll.
 */
function activarMenuDetalle(cont) {
  const links = cont.querySelectorAll('.nav-seccion');
  links.forEach(link => {
    link.addEventListener('click', (ev) => {
      ev.preventDefault();
      const destino = document.getElementById('seccion-' + link.dataset.idx);
      if (destino) destino.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  const secciones = cont.querySelectorAll('.seccion[id^="seccion-"]');
  if (!secciones.length || !('IntersectionObserver' in window)) return;

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = entry.target.id.replace('seccion-', '');
      links.forEach(l => l.classList.toggle('activo', l.dataset.idx === idx));
    });
  }, { rootMargin: '-20% 0px -70% 0px' }); // considera "activa" la sección cerca de la parte superior visible

  secciones.forEach(s => observer.observe(s));
}

function cerrarDetalle() {
  document.getElementById('detalleProyecto').style.display = 'none';
}

async function guardarCampo(codigo, header, fieldId, boton) {
  const valor = document.getElementById(fieldId).value;
  if (boton) { var textoOriginal = boton.textContent; boton.disabled = true; boton.textContent = 'Guardando...'; }
  try {
    const res = await apiCall('guardarCelda', { codigo_proyecto: codigo, header, valor });
    if (!res.ok) {
      alert('No se pudo guardar: ' + res.error);
      if (boton) { boton.disabled = false; boton.textContent = textoOriginal; }
      return;
    }
    // Actualiza el dato en memoria para no depender de un recargo completo
    const fila = matrizData.filas.find(f => String(f.codigo_proyecto) === String(codigo));
    if (fila && fila.datos[header]) fila.datos[header].valor = valor;
    if (res.debug) console.log('Guardado en Sheet:', res.debug);

    if (boton) {
      boton.textContent = '✓ Guardado';
      setTimeout(() => { boton.disabled = false; boton.textContent = textoOriginal; }, 1500);
    }
    cargarMatriz(); // refresca la tabla (avance físico, etc.) en segundo plano, sin bloquear la vista
  } catch (err) {
    console.error('Error al guardar la celda:', err);
    alert('Ocurrió un error de conexión al guardar. Revisa la consola (F12) para más detalle.');
    if (boton) { boton.disabled = false; boton.textContent = textoOriginal; }
  }
}

async function cargarPendientes() {
  const res = await apiCall('obtenerPendientesAprobacion', {});
  const tbody = document.getElementById('tablaPendientes');
  tbody.innerHTML = '';
  if (!res.ok) return;
  res.pendientes.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${p.codigo_proyecto}</td><td>${MESES[p.mes - 1]}</td><td>${p.usuario_envia}</td>
      <td>${new Date(p.fecha_envio).toLocaleString()}</td>
      <td>
        <button class="aprobar" onclick="resolver('${p.codigo_proyecto}', ${p.mes}, 'APROBADO')">Aprobar</button>
        <button class="rechazar" onclick="resolver('${p.codigo_proyecto}', ${p.mes}, 'RECHAZADO')">Rechazar</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

async function resolver(codigo, mes, decision) {
  let comentario = '';
  if (decision === 'RECHAZADO') {
    comentario = prompt('Motivo del rechazo (se enviará al Gestor):') || '';
  }
  const res = await apiCall('resolverAprobacion', { codigo_proyecto: codigo, mes, decision, comentario });
  if (!res.ok) { alert(res.error); return; }

  if (res.notificacion && res.notificacion.enviados > 0) {
    alert('Decisión registrada. Se notificó por correo al Gestor.');
  } else {
    alert('La decisión se registró correctamente, PERO el correo de aviso al Gestor no se pudo enviar.\n\n' +
      'Motivo: ' + (res.notificacion ? res.notificacion.motivo : 'desconocido'));
  }
  cargarPendientes();
  actualizarBadgePendientes();
}

async function actualizarBadgePendientes() {
  const res = await apiCall('obtenerPendientesAprobacion', {});
  const badge = document.getElementById('badgePendientes');
  if (res.ok && res.pendientes.length > 0) {
    badge.textContent = res.pendientes.length;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}

cargarMatriz();
actualizarBadgePendientes(); // se calcula al entrar, sin esperar a que hagan clic en la pestaña
</script>
</body>
</html>
