<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestor de Objetivos - Gestión de Objetivos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <h1>Gestor de Objetivos</h1>
  <div class="usuario-info">
    <span id="nombreUsuario"></span> &nbsp;
    <button class="secundario" onclick="salir()">Cerrar sesión</button>
  </div>
</header>

<main>
  <div class="tarjeta">
    <p>Estos son los proyectos a tu cargo. Ingresa el avance del mes correspondiente y envíalo a aprobación del Director.</p>
    <table>
      <thead><tr><th>Código</th><th>Proyecto</th><th>Avance Físico</th><th></th></tr></thead>
      <tbody id="tablaProyectos"></tbody>
    </table>
  </div>
  <div class="tarjeta" id="detalleProyecto" style="display:none"></div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
requireLogin(['Gestor de Objetivos']);
document.getElementById('nombreUsuario').textContent = sessionStorage.getItem('nombre') || sessionStorage.getItem('usuario');

const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];

const TRIMESTRES_GESTOR = [
  { meses: ['E-ENERO', 'E-FEBRERO', 'E-MARZO'], total: 'TRIMESTRE 1', numeros: [1, 2, 3] },
  { meses: ['E-ABRIL', 'E-MAYO', 'E-JUNIO'], total: 'TRIMESTRE 2', numeros: [4, 5, 6] },
  { meses: ['E- JULIO', 'E-AGOSTO', 'E-SEPTIEMBRE'], total: 'TRIMESTRE 3', numeros: [7, 8, 9] },
  { meses: ['E-OCTUBRE', 'E-NOVIEMBRE', 'E-DICIEMBRE'], total: 'TRIMESTRE 3', numeros: [10, 11, 12] }
];

function salir() { cerrarSesionLocal(); window.location.href = 'index.html'; }

let matrizData = null;

/** Convierte el valor crudo de AVANCE FÍSICO (número 0-1, texto "70,00%", etc.) a un entero 0-100. */
function porcentajeANumero(valorCrudo) {
  if (valorCrudo === null || valorCrudo === undefined || valorCrudo === '') return 0;
  if (typeof valorCrudo === 'number') {
    return valorCrudo <= 1 ? Math.round(valorCrudo * 100) : Math.round(valorCrudo);
  }
  const limpio = String(valorCrudo).replace('%', '').replace(',', '.').trim();
  const num = parseFloat(limpio);
  if (isNaN(num)) return 0;
  return num <= 1 ? Math.round(num * 100) : Math.round(num);
}

function colorSemaforo(pct) {
  if (pct < 40) return 'rojo';
  if (pct < 75) return 'amarillo';
  return 'verde';
}

function renderProgreso(valorCrudo) {
  const pct = Math.max(0, Math.min(100, porcentajeANumero(valorCrudo)));
  const color = colorSemaforo(pct);
  return `<div class="progreso-wrap">
    <div class="progreso-barra-contenedor"><div class="progreso-barra ${color}" style="width:${pct}%"></div></div>
    <span class="progreso-texto ${color}">${pct}%</span>
  </div>`;
}

async function cargarMatriz() {
  const res = await apiCall('obtenerMatriz', {});
  if (!res.ok) { alert(res.error); return; }
  matrizData = res;
  const tbody = document.getElementById('tablaProyectos');
  tbody.innerHTML = '';
  res.filas.forEach(fila => {
    const proyecto = fila.datos['PROYECTO'] ? fila.datos['PROYECTO'].valor : '';
    const avanceFisico = fila.datos['AVANCE FÍSICO'] ? fila.datos['AVANCE FÍSICO'].valor : 0;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${fila.codigo_proyecto}</td><td>${proyecto}</td>
      <td>${renderProgreso(avanceFisico)}</td>
      <td><button data-codigo="${fila.codigo_proyecto}" class="btn-ver-detalle">Ver / Ingresar avance</button></td>`;
    tbody.appendChild(tr);
  });
  if (!res.filas.length) {
    tbody.innerHTML = '<tr><td colspan="4">No tienes proyectos asignados todavía. Contacta al Administrador.</td></tr>';
  }

  tbody.querySelectorAll('.btn-ver-detalle').forEach(btn => {
    btn.addEventListener('click', () => verDetalle(btn.dataset.codigo));
  });
}

function fieldIdDe(header) {
  return 'campo_' + header.replace(/[^a-zA-Z0-9]/g, '_');
}

function estadoDeCampo(campo) {
  // El backend no manda el estado textual directamente, lo inferimos:
  // si no es editable y su perfil es Gestor, está aprobado (bloqueado).
  if (!campo) return null;
  if (campo.editable) return null; // pendiente o rechazado (se puede editar igual)
  return 'APROBADO';
}

function verDetalle(codigo) {
  console.log('verDetalle llamado con codigo:', codigo);
  if (!matrizData) { console.warn('matrizData aún no está cargado.'); return; }
  const fila = matrizData.filas.find(f => String(f.codigo_proyecto).trim() === String(codigo).trim());
  if (!fila) {
    console.warn('No se encontró ninguna fila con codigo_proyecto =', codigo,
      '. Códigos disponibles:', matrizData.filas.map(f => f.codigo_proyecto));
    return;
  }
  const datos = fila.datos;
  const cont = document.getElementById('detalleProyecto');
  cont.style.display = 'block';

  let html = `<div class="detalle-header">
    <h3>Proyecto ${codigo}${datos['PROYECTO'] ? ' — ' + datos['PROYECTO'].valor : ''}</h3>
    ${datos['AVANCE FÍSICO'] ? renderProgreso(datos['AVANCE FÍSICO'].valor) : ''}
    <button class="secundario" onclick="cerrarDetalle()">Cerrar</button>
  </div>
  <p style="font-size:13px;color:#555">
    Ingresa el % de avance físico del mes correspondiente y presiona "Guardar". Cuando el dato esté listo,
    presiona "Enviar" para que el Director de Planificación lo apruebe. Los meses ya aprobados quedan bloqueados.
  </p>`;

  TRIMESTRES_GESTOR.forEach((t, idxTrimestre) => {
    html += `<div class="seccion"><h4 class="seccion-titulo">Trimestre ${idxTrimestre + 1}</h4><div class="seccion-cuerpo" style="grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));">`;
    t.meses.forEach((header, i) => {
      const campo = datos[header];
      const mesNum = t.numeros[i];
      const fieldId = fieldIdDe(header);
      const nombreMes = header.replace(/^E-\s*/, '');
      if (!campo) {
        html += `<div class="campo-item"><label>${nombreMes}</label><span class="valor-vacio">— sin datos —</span></div>`;
        return;
      }
      if (campo.editable) {
        html += `<div class="campo-item">
          <label>${nombreMes} <span class="badge PENDIENTE">pendiente de envío</span></label>
          <div class="campo-input-row">
            <input class="celda-editable" id="${fieldId}" value="${campo.valor}" placeholder="0%">
            <button onclick="guardarCampo('${codigo.replace(/'/g,"\\'")}', '${header.replace(/'/g,"\\'")}', '${fieldId}', this)">Guardar</button>
          </div>
          <button class="aprobar" style="margin-top:4px" onclick="enviarAprobacion('${codigo.replace(/'/g,"\\'")}', ${mesNum})">Enviar a aprobación</button>
        </div>`;
      } else {
        html += `<div class="campo-item">
          <label>${nombreMes} <span class="badge APROBADO">Aprobado</span></label>
          <input class="celda-bloqueada" value="${campo.valor}" disabled>
        </div>`;
      }
    });
    const campoTotal = datos[t.total];
    html += `<div class="campo-item"><label>Total del trimestre (calculado por el sistema)</label>
      <input class="celda-bloqueada" value="${campoTotal ? campoTotal.valor : '—'}" disabled></div>`;
    html += '</div></div>';
  });

  const campoAvanceFisico = datos['AVANCE FÍSICO'];
  if (campoAvanceFisico) {
    html += `<div class="seccion"><h4 class="seccion-titulo">Avance físico total (calculado por el sistema)</h4>
      <div class="seccion-cuerpo"><input class="celda-bloqueada" value="${campoAvanceFisico.valor}" disabled></div></div>`;
  }

  cont.innerHTML = html;
  cont.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function cerrarDetalle() {
  document.getElementById('detalleProyecto').style.display = 'none';
}

async function guardarCampo(codigo, header, fieldId, boton) {
  const valor = document.getElementById(fieldId).value;
  if (boton) { var textoOriginal = boton.textContent; boton.disabled = true; boton.textContent = 'Guardando...'; }
  try {
    const res = await apiCall('guardarCelda', { codigo_proyecto: codigo, header, valor });
    if (!res.ok) {
      alert('No se pudo guardar: ' + res.error);
      if (boton) { boton.disabled = false; boton.textContent = textoOriginal; }
      return;
    }
    const fila = matrizData.filas.find(f => String(f.codigo_proyecto) === String(codigo));
    if (fila && fila.datos[header]) fila.datos[header].valor = valor;

    if (boton) {
      boton.textContent = '✓ Guardado';
      setTimeout(() => { boton.disabled = false; boton.textContent = textoOriginal; }, 1500);
    }
    cargarMatriz();
  } catch (err) {
    console.error('Error al guardar la celda:', err);
    alert('Ocurrió un error de conexión al guardar. Revisa la consola (F12) para más detalle.');
    if (boton) { boton.disabled = false; boton.textContent = textoOriginal; }
  }
}

async function enviarAprobacion(codigo, mes) {
  const res = await apiCall('enviarAprobacion', { codigo_proyecto: codigo, mes });
  if (!res.ok) { alert(res.error); return; }
  alert('Enviado a aprobación del Director de Planificación.');
  await cargarMatriz();
  verDetalle(codigo);
}

cargarMatriz();
</script>
</body>
</html>
