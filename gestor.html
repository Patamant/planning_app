<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestor de Objetivos - Gestión de Objetivos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <h1>Gestor de Objetivos</h1>
  <div class="usuario-info">
    <span id="nombreUsuario"></span> &nbsp;
    <button class="secundario" onclick="salir()">Cerrar sesión</button>
  </div>
</header>

<main>
  <div class="tarjeta">
    <p>Estos son los proyectos a tu cargo. Ingresa el avance del mes correspondiente y envíalo a aprobación del Director.</p>
    <table>
      <thead><tr><th>Código</th><th>Proyecto</th><th></th></tr></thead>
      <tbody id="tablaProyectos"></tbody>
    </table>
  </div>
  <div class="tarjeta" id="detalleProyecto" style="display:none"></div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
requireLogin(['Gestor de Objetivos']);
document.getElementById('nombreUsuario').textContent = sessionStorage.getItem('nombre') || sessionStorage.getItem('usuario');

const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];

function salir() { cerrarSesionLocal(); window.location.href = 'index.html'; }

let matrizData = null;

async function cargarMatriz() {
  const res = await apiCall('obtenerMatriz', {});
  if (!res.ok) { alert(res.error); return; }
  matrizData = res;
  const tbody = document.getElementById('tablaProyectos');
  tbody.innerHTML = '';
  res.filas.forEach(fila => {
    const proyecto = fila.datos['PROYECTO'] ? fila.datos['PROYECTO'].valor : '';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${fila.codigo_proyecto}</td><td>${proyecto}</td>
      <td><button onclick="verDetalle('${fila.codigo_proyecto}')">Ver / Ingresar avance</button></td>`;
    tbody.appendChild(tr);
  });
  if (!res.filas.length) {
    tbody.innerHTML = '<tr><td colspan="3">No tienes proyectos asignados todavía. Contacta al Administrador.</td></tr>';
  }
}

function mesDeHeader(header) {
  for (let i = 0; i < MESES.length; i++) {
    if (header.toUpperCase().indexOf(MESES[i]) !== -1) return i + 1;
  }
  return null;
}

function verDetalle(codigo) {
  const fila = matrizData.filas.find(f => String(f.codigo_proyecto) === String(codigo));
  if (!fila) return;
  const cont = document.getElementById('detalleProyecto');
  cont.style.display = 'block';
  cont.innerHTML = `<h3>Proyecto: ${codigo}</h3><div id="camposDetalle"></div>`;
  const camposDiv = document.getElementById('camposDetalle');

  Object.keys(fila.datos).forEach(header => {
    const campo = fila.datos[header];
    if (campo.perfil_columna !== 'Gestor de Objetivos') return; // el Gestor solo ve/edita sus columnas

    const mes = mesDeHeader(header);
    const fieldId = 'campo_' + header.replace(/[^a-zA-Z0-9]/g, '_');
    const row = document.createElement('div');
    row.style.marginBottom = '10px';

    let inputHtml;
    if (campo.editable) {
      inputHtml = `<input class="celda-editable" id="${fieldId}" value="${campo.valor}">
        <button onclick="guardarCampo('${codigo}', '${header.replace(/'/g,"\\'")}', '${fieldId}')">Guardar</button>`;
      if (mes) {
        inputHtml += ` <button class="aprobar" onclick="enviarAprobacion('${codigo}', ${mes})">Enviar a aprobación</button>`;
      }
    } else {
      inputHtml = `<input class="celda-bloqueada" value="${campo.valor}" disabled> <span class="badge APROBADO">Aprobado - bloqueado</span>`;
    }

    row.innerHTML = `<label><b>${header}</b></label><br>${inputHtml}`;
    camposDiv.appendChild(row);
  });
}

async function guardarCampo(codigo, header, fieldId) {
  const valor = document.getElementById(fieldId).value;
  const res = await apiCall('guardarCelda', { codigo_proyecto: codigo, header, valor });
  if (!res.ok) { alert(res.error); return; }
  await cargarMatriz();
  verDetalle(codigo);
}

async function enviarAprobacion(codigo, mes) {
  const res = await apiCall('enviarAprobacion', { codigo_proyecto: codigo, mes });
  if (!res.ok) { alert(res.error); return; }
  alert('Enviado a aprobación del Director de Planificación.');
  await cargarMatriz();
  verDetalle(codigo);
}

cargarMatriz();
</script>
</body>
</html>
